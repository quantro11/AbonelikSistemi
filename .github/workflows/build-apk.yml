name: APK & AAB Build + Release

# Tetikleyiciler:
# 1) `git push` (main)       -> flutter analyze, flutter test, Release APK & AAB derler (artifact olarak yukler).
# 2) `git tag v2.0.0` + push -> Her seyi dogrular, APK + AAB + ZIP + SHA256SUMS ile GitHub Release olusturur.
# 3) Manual "Run workflow"   -> Istege bagli elle derleme.

on:
  push:
    tags:
      - 'v*'
    branches:
      - 'main'
  pull_request:
    branches:
      - 'main'
  workflow_dispatch:

permissions:
  contents: write

env:
  APP_NAME: subscription_manager
  APK_PREFIX: abonelik-yoneticisi

jobs:
  build:
    name: Analyze, Test & Build (APK + AAB)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Accept Android SDK licenses
        run: |
          if [ -f "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" ]; then
            yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null 2>&1 || true
          fi

      # lib/, test/ ve pubspec.yaml hazir oldugu icin eksik platform dosyalarini
      # (gradle, MainActivity.kt vb.) CI'da uretiyoruz. Var olan dosyalar korunur.
      - name: Generate Android platform scaffolding (com.quantro.subscription_manager)
        run: |
          flutter create --org com.quantro --project-name subscription_manager --platforms=android .
          rm -f test/widget_test.dart

      - name: Configure core library desugaring & optional release signing
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASS: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          python3 - <<'PY'
          import base64, os, re

          p = 'android/app/build.gradle'
          if not os.path.exists(p):
              p = 'android/app/build.gradle.kts'
          assert os.path.exists(p), 'Android app build.gradle(.kts) bulunamadi'
          s = open(p, encoding='utf-8').read()

          # 0) Google Play 2026 Android 16 (API 36) targetSdk / compileSdk zorunlulugu
          if p.endswith('.kts'):
              s = re.sub(r'compileSdk\s*=\s*[^\n]+', 'compileSdk = 36', s)
              s = re.sub(r'targetSdk\s*=\s*[^\n]+', 'targetSdk = 36', s)
          else:
              s = re.sub(r'compileSdk(?:Version)?\s+[^\n]+', 'compileSdk 36', s)
              s = re.sub(r'targetSdk(?:Version)?\s+[^\n]+', 'targetSdk 36', s)

          # 1) Core library desugaring (flutter_local_notifications icin zorunlu)
          if p.endswith('.kts'):
              if 'isCoreLibraryDesugaringEnabled' not in s:
                  s = s.replace(
                      'compileOptions {',
                      'compileOptions {\n        isCoreLibraryDesugaringEnabled = true',
                      1,
                  )
              if 'coreLibraryDesugaring' not in s:
                  s += '\ndependencies {\n    coreLibraryDesugaring("com.android.tools:desugar_jdk_libs:2.1.4")\n}\n'
          else:
              if 'isCoreLibraryDesugaringEnabled' not in s and 'coreLibraryDesugaringEnabled' not in s:
                  if 'compileOptions {' in s:
                      s = s.replace(
                          'compileOptions {',
                          'compileOptions {\n        coreLibraryDesugaringEnabled true',
                          1,
                      )
                  else:
                      s = s.replace(
                          'android {',
                          'android {\n    compileOptions {\n        coreLibraryDesugaringEnabled true\n    }',
                          1,
                      )
              if 'desugar_jdk_libs' not in s:
                  if 'dependencies {' in s:
                      s = s.replace(
                          'dependencies {',
                          'dependencies {\n    coreLibraryDesugaring "com.android.tools:desugar_jdk_libs:2.1.4"',
                          1,
                      )
                  else:
                      s += '\ndependencies {\n    coreLibraryDesugaring "com.android.tools:desugar_jdk_libs:2.1.4"\n}\n'

          # 2) Opsiyonel Play Store keystore imzalama (4 GitHub Secret tanimliysa)
          ks_b64 = os.environ.get('KEYSTORE_B64', '').strip()
          ks_pass = os.environ.get('KEYSTORE_PASS', '').strip()
          key_alias = os.environ.get('KEY_ALIAS', '').strip()
          key_pass = os.environ.get('KEY_PASS', '').strip()

          if ks_b64 and ks_pass and key_alias and key_pass:
              with open('android/app/upload-keystore.jks', 'wb') as f:
                  f.write(base64.b64decode(ks_b64))
              with open('android/key.properties', 'w', encoding='utf-8') as f:
                  f.write(
                      f'storePassword={ks_pass}\n'
                      f'keyPassword={key_pass}\n'
                      f'keyAlias={key_alias}\n'
                      f'storeFile=upload-keystore.jks\n'
                  )
              if p.endswith('.kts'):
                  header = (
                      'import java.util.Properties\n'
                      'import java.io.FileInputStream\n'
                      'val keystoreProperties = Properties()\n'
                      'val keystorePropertiesFile = rootProject.file("key.properties")\n'
                      'if (keystorePropertiesFile.exists()) {\n'
                      '    keystoreProperties.load(FileInputStream(keystorePropertiesFile))\n'
                      '}\n\n'
                  )
                  s = header + s
                  signing_block = (
                      '    signingConfigs {\n'
                      '        create("release") {\n'
                      '            keyAlias = keystoreProperties.getProperty("keyAlias")\n'
                      '            keyPassword = keystoreProperties.getProperty("keyPassword")\n'
                      '            storeFile = file(keystoreProperties.getProperty("storeFile"))\n'
                      '            storePassword = keystoreProperties.getProperty("storePassword")\n'
                      '        }\n'
                      '    }\n'
                      '    buildTypes {'
                  )
                  s = s.replace('    buildTypes {', signing_block, 1)
                  s = s.replace(
                      'signingConfig = signingConfigs.getByName("debug")',
                      'signingConfig = signingConfigs.getByName("release")',
                  )
              print('Production release signing configured via GitHub Secrets.')
          else:
              print('Release keystore secrets not set; building with default signing config (see docs/RELEASE_GUIDE.md).')

          with open(p, 'w', encoding='utf-8') as f:
              f.write(s)
          print('Patched successfully:', p)
          PY

      - name: Fetch dependencies
        run: flutter pub get

      # file_picker 8.x android/build.gradle'da compileSdk 34'u hardcode eder;
      # flutter_plugin_android_lifecycle ile checkReleaseAarMetadata hatasini onler.
      - name: Patch file_picker compileSdk (34 -> 36)
        run: |
          set -e
          FP_DIR=$(ls -d "$HOME/.pub-cache/hosted/pub.dev"/file_picker-* 2>/dev/null | sort -V | tail -1)
          FP="$FP_DIR/android/build.gradle"
          if [ -f "$FP" ]; then
            sed -i 's/compileSdk 34/compileSdk 36/' "$FP"
            grep -n "compileSdk" "$FP"
          fi

      - name: Static analysis (flutter analyze)
        run: |
          set +e
          flutter analyze 2>&1 | tee analyze.log
          rc=${PIPESTATUS[0]}
          if [ "$rc" -ne 0 ]; then
            (grep -E "error •" analyze.log; grep -E "warning •" analyze.log; grep -E "info •" analyze.log) | head -40 | while IFS= read -r line; do
              echo "::error file=analyze.log::$line"
            done
            exit "$rc"
          fi

      - name: Unit tests (flutter test)
        run: |
          set +e
          flutter test --reporter expanded 2>&1 | tee test.log
          rc=${PIPESTATUS[0]}
          if [ "$rc" -ne 0 ]; then
            grep -E "\[E\]|FAILED" test.log | head -40 | while IFS= read -r line; do
              echo "::error file=test.log::$line"
            done
            exit "$rc"
          fi

      - name: Build Release APK
        run: flutter build apk --release

      - name: Build Play Store App Bundle (AAB)
        run: flutter build appbundle --release

      - name: Package release artifacts (APK, AAB, ZIP, SHA256SUMS)
        run: |
          set -e
          mkdir -p release-assets
          VERSION="${GITHUB_REF_NAME:-dev}"
          APK_FILE="release-assets/${APK_PREFIX}-${VERSION}.apk"
          AAB_FILE="release-assets/${APK_PREFIX}-${VERSION}.aab"
          ZIP_FILE="release-assets/${APP_NAME}-${VERSION}.zip"

          cp build/app/outputs/flutter-apk/app-release.apk "${APK_FILE}"
          cp build/app/outputs/bundle/release/app-release.aab "${AAB_FILE}"
          cp build/app/outputs/flutter-apk/app-release.apk ./app-release.apk

          zip -rq "${ZIP_FILE}" \
            app-release.apk \
            lib test pubspec.yaml README.md PRIVACY_POLICY.md LICENSE \
            android -x "android/build/*" "android/app/build/*" "android/.gradle/*" "android/key.properties" "android/app/upload-keystore.jks"
          rm -f ./app-release.apk

          (cd release-assets && sha256sum * > SHA256SUMS.txt)
          ls -lh release-assets/
          cat release-assets/SHA256SUMS.txt

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: abonelik-yoneticisi-${{ github.ref_name }}
          path: release-assets/
          if-no-files-found: error

      - name: Create GitHub Release (on v* tags)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: release-assets/*
          generate_release_notes: true
